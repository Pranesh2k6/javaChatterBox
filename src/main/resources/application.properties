# Application name
spring.application.name=chatterbox

# Server configuration
server.port=8081

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/chat_application
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
# Local secrets (git-ignored). Copy application-secrets.properties.example
# to application-secrets.properties and put your DB password there,
# or set the DB_PASSWORD environment variable instead.
spring.config.import=optional:classpath:application-secrets.properties

# JDBC configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Disable automatic schema generation
spring.sql.init.mode=never

# Logging
logging.level.org.springframework.jdbc=DEBUG

# Testing
app.repository-tests.enabled=false

# WebSocket
spring.websocket.max-text-message-size=65536
spring.websocket.max-binary-message-size=65536